<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ForgeAI turns a task into a tested pull request: it reads your repository, plans, writes the code, runs your tests in a sandbox and fixes what fails."
    />
    <title>ForgeAI</title>
    <script>
      // Apply a saved light or dark choice before the first paint, so a reload
      // never flashes the other theme. See src/lib/theme.ts.
      try {
        var theme = localStorage.getItem('forgeai.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
