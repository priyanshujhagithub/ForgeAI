# Settings for a small hosted instance (Render's free plan: 512 MB, 0.1 CPU),
# switched on with SPRING_PROFILES_ACTIVE=prod.

# The database (Neon's free plan) suspends itself after five idle minutes and
# is billed for the time it is awake. Keep no idle connections, so an idle
# service lets it sleep; a connection is opened again on the next request.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000

# Fewer request threads: each one reserves memory, and traffic is light.
server.tomcat.threads.max=20

# Behind the host's proxy, trust its X-Forwarded-* headers for scheme and host.
server.forward-headers-strategy=framework
