spring.application.name=project-service

# A host such as Render says which port to listen on through PORT.
server.port=${PORT:8080}

# The defaults are the local compose database. Deployed, all three come from
# the environment (see docs/deployment.md).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/forgeai}
spring.datasource.username=${DATABASE_USERNAME:forgeai}
spring.datasource.password=${DATABASE_PASSWORD:forgeai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
# Secrets are read from the environment (see .env.example); none live in this file.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}


ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
# Shared secret the AI service requires when it is exposed. Blank locally.
ai-service.token=${AI_SERVICE_TOKEN:}
ai-service.connect-timeout=5s
ai-service.read-timeout=15m
# A solve call runs several model calls and sandbox attempts.
ai-service.solve-read-timeout=60m

# Agent runs worked on at once, and how many may wait.
agent-runs.max-concurrent=1
agent-runs.queue-capacity=5

# Who may start runs (comma-separated emails; blank means anyone signed in),
# and how many runs each account may start per UTC day (0 means no limit).
forgeai.runs.allowed-emails=${FORGEAI_ALLOWED_EMAILS:}
forgeai.runs.daily-limit=${FORGEAI_DAILY_RUN_LIMIT:0}

# AES-256 key (base64) used to encrypt stored GitHub tokens.
forgeai.encryption-key=${FORGEAI_ENCRYPTION_KEY}

# The compose database is created with the V1 schema already in place
# (infrastructure/postgres/init), so Flyway starts from V1 there. On a truly
# empty database every migration runs, as the integration tests do.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Where the web app is served. The GitHub OAuth callback redirects back here.
forgeai.frontend-url=${FORGEAI_FRONTEND_URL:http://localhost:5180}
