name: CI

on:
  push:
  pull_request:

# No secrets are used here on purpose: every test runs against fakes or a
# throwaway container, so CI never calls a model, E2B, Langfuse or GitHub.

jobs:
  project-service:
    name: Java control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/project-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers; the runner has Docker.
      - run: ./mvnw -B verify

  ai-service:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  ui:
    name: Streamlit UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
